<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Interactive</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>SpendWise</h1>
    <p>Interactive Budget Management Dashboard</p>
</header>

<main class="container">

    <!-- Budget -->
    <section class="card">
        <h2>Set Monthly Budget</h2>

        <form id="budgetForm">
            <input
                type="number"
                id="budgetInput"
                placeholder="Enter budget"
                min="1"
                required
            >

            <button type="submit">Set Budget</button>
        </form>
    </section>

    <!-- Dashboard -->
    <section class="dashboard">

        <div class="card">
            <h3>Monthly Budget</h3>
            <p id="budgetDisplay">KSh 0.00</p>
        </div>

        <div class="card">
            <h3>Total Expenses</h3>
            <p id="expenseDisplay">KSh 0.00</p>
        </div>

        <div class="card">
            <h3>Remaining Balance</h3>
            <p id="balanceDisplay">KSh 0.00</p>
        </div>

        <div class="card">
            <h3>Expense Records</h3>
            <p id="countDisplay">0</p>
        </div>

    </section>

    <!-- Add Expense -->
    <section class="card">

        <h2>Add Expense</h2>

        <form id="expenseForm">

            <input
                type="text"
                id="description"
                placeholder="Expense description"
                required
            >

            <select id="category" required>
                <option value="">Select category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Rent">Rent</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Savings">Savings</option>
                <option value="Utilities">Utilities</option>
                <option value="Other">Other</option>
            </select>

            <input
                type="number"
                id="amount"
                placeholder="Amount"
                min="0.01"
                step="0.01"
                required
            >

            <button type="submit">Add Expense</button>

        </form>

        <p id="message"></p>

    </section>

    <!-- Expenses -->
    <section class="card">

        <div class="section-header">
            <h2>Expense Records</h2>
            <button id="clearButton" class="clear-button">
                Clear All
            </button>
        </div>

        <div id="expenseList">
            <p>No expenses added yet.</p>
        </div>

    </section>

</main>

<footer>
    <p>SpendWise © 2026</p>
</footer>

<script src="script.js"></script>

</body>
</html>
