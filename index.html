<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="dashboard">

        <aside class="sidebar">
            <h1>SpendWise</h1>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Expenses</a>
                <a href="#">Budget</a>
                <a href="#">Savings</a>
            </nav>
        </aside>

        <main class="main-content">

            <header class="header">
                <div>
                    <h2>Budget Dashboard</h2>
                    <p>Track your spending and manage your budget.</p>
                </div>
            </header>

            <section class="cards">

                <article class="card">
                    <h3>Food</h3>
                    <p>KSh 0</p>
                </article>

                <article class="card">
                    <h3>Transport</h3>
                    <p>KSh 0</p>
                </article>

                <article class="card">
                    <h3>Rent</h3>
                    <p>KSh 0</p>
                </article>

                <article class="card">
                    <h3>Entertainment</h3>
                    <p>KSh 0</p>
                </article>

                <article class="card">
                    <h3>Savings</h3>
                    <p>KSh 0</p>
                </article>

                <article class="card">
                    <h3>Utilities</h3>
                    <p>KSh 0</p>
                </article>

            </section>

            <section class="summary">
                <h2>Budget Summary</h2>
                <p>Open the browser console to see your calculated budget results.</p>
            </section>

        </main>
    </div>
</body>
</html>
