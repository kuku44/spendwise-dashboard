<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>SpendWise</h1>
        <p>Smart budgeting made simple</p>
    </header>

    <main>
        <section class="dashboard">
            <div class="card">
                <h2>Food</h2>
                <p>Track your food expenses.</p>
            </div>

            <div class="card">
                <h2>Transport</h2>
                <p>Track your transport expenses.</p>
            </div>

            <div class="card">
                <h2>Rent</h2>
                <p>Track your rent expenses.</p>
            </div>

            <div class="card">
                <h2>Entertainment</h2>
                <p>Track entertainment expenses.</p>
            </div>

            <div class="card">
                <h2>Savings</h2>
                <p>Track your savings.</p>
            </div>

            <div class="card">
                <h2>Utilities</h2>
                <p>Track utility expenses.</p>
            </div>
        </section>
    </main>

    <!-- JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
